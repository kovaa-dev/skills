name: Validate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python3 scripts/validate.py

      - name: Verify skills CLI discovery
        env:
          DISABLE_TELEMETRY: "1"
        run: npx --yes skills@1.5.26 add . --list
