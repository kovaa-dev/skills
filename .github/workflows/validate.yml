name: Validate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python3 scripts/validate.py

      - name: Verify skills CLI discovery
        env:
          DISABLE_TELEMETRY: "1"
        run: npx --yes skills@1.5.26 add . --list

      - name: Report dispatched validation status
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: >-
          gh api --method POST
          'repos/${{ github.repository }}/statuses/${{ github.sha }}'
          -f state="$VALIDATION_STATE"
          -f context='validate'
          -f description="Repository validation: $VALIDATION_STATE"
          -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
